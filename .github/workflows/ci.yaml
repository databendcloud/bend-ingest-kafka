name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:4.0.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      # The all-in-one image's MINIO_ENABLED path downloads a binary at
      # startup. Use a pinned container instead, keeping S3/presign coverage.
      - name: Start MinIO and Databend
        run: |
          docker run -d --name ci-minio --network host --user 0:0 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            --entrypoint /bin/sh \
            bitnamilegacy/minio:2025.7.23 \
            -c 'mkdir -p /data/databend && exec minio server /data'
          curl --fail --silent --show-error --retry 30 --retry-delay 2 \
            --retry-all-errors --max-time 5 --retry-max-time 120 \
            http://127.0.0.1:9000/minio/health/ready
          docker run -d --name ci-databend --network host \
            -e QUERY_DEFAULT_USER=databend \
            -e QUERY_DEFAULT_PASSWORD=databend \
            -e QUERY_STORAGE_TYPE=s3 \
            -e AWS_S3_ENDPOINT=http://127.0.0.1:9000 \
            -e AWS_S3_BUCKET=databend \
            -e AWS_ACCESS_KEY_ID=minioadmin \
            -e AWS_SECRET_ACCESS_KEY=minioadmin \
            datafuselabs/databend
          curl --fail --silent --show-error --retry 30 --retry-delay 2 \
            --retry-all-errors --max-time 5 --retry-max-time 120 \
            --user databend:databend --header 'Content-Type: application/json' \
            --data '{"sql":"SELECT 1"}' http://127.0.0.1:8000/v1/query \
            | jq -e '.error == null and .data == [["1"]]'

      - name: Test
        env:
          TEST_DATABEND_DSN: "http://databend:databend@localhost:8000/default"
          TEST_KAFKA_BROKER: "localhost:9092"
          CGO_ENABLED: "1"
        run: |
          go test -v -p 1 -cover $(go list ./... | grep -v /scripts)

      - name: Service logs
        if: always()
        run: |
          docker logs --tail 200 ci-minio 2>&1 || true
          docker logs --tail 200 ci-databend 2>&1 || true
          docker logs --tail 200 '${{ job.services.kafka.id }}' 2>&1 || true
